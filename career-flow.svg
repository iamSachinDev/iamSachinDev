<svg width="880" height="240" viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Sachin Talekar career path flow</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="240" rx="14" fill="#0d1117"/>

  <!-- connectors first (behind cards) -->
  <line x1="168" y1="120" x2="188" y2="120" stroke="#a78bfa" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="332" y1="120" x2="352" y2="120" stroke="#a78bfa" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="496" y1="120" x2="516" y2="120" stroke="#a78bfa" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="660" y1="120" x2="680" y2="120" stroke="#a78bfa" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Card A: Jio -->
  <rect x="16" y="64" width="152" height="112" rx="12" fill="#161b22" stroke="#667eea" stroke-width="2"/>
