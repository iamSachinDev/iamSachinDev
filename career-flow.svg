  <text x="772" y="166" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#f093fb">MCP</text>

  <!-- caption strip -->
  <text x="92"  y="206" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">streaming scale</text>
  <text x="260" y="206" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">fintech rigor</text>
  <text x="424" y="206" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">consumer scale</text>
  <text x="588" y="206" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">team leadership</text>
  <text x="772" y="206" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">applied AI</text>
